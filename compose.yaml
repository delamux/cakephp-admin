name: cakephp-admin

# Shared by app and worker (same code, same database, same SMTP)
x-app-environment: &app-environment
  DEBUG: "true"
  # Links in emails and the WebAuthn domain (keys are bound to it). Without a certificate: http://localhost:8080
  APP_FULL_BASE_URL: "${APP_FULL_BASE_URL:-https://admindashboard.localhost}"
  DATABASE_URL: "postgres://cakephp:secret@db:5432/cakephp_admin"
  DATABASE_TEST_URL: "postgres://cakephp:secret@db:5432/cakephp_admin_test"
  EMAIL_TRANSPORT_DEFAULT_URL: "smtp://mailpit:1025"
  EMAIL_FROM: "admin@cakephp-admin.test"

services:
  # nginx -> PHP-FPM (dev: code bind-mounted, Tailwind from the browser build)
  web:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
      # HTTPS (mkcert certificate in docker/certs, bin/dev-https-cert). https://admindashboard.localhost without
      # a port goes through ~/code/local-https-proxy (443 shared by domain with other projects)
      - "${HTTPS_PORT:-8445}:443"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/app-locations.conf:/etc/nginx/app-locations.conf:ro
      - ./docker/nginx/https.conf:/etc/nginx/https.conf.template:ro
      - ./docker/nginx/10-enable-https.sh:/docker-entrypoint.d/10-enable-https.sh:ro
      - ./docker/nginx/00-upstream.conf.template:/etc/nginx/templates/00-upstream.conf.template:ro
      - ./docker/certs:/etc/nginx/certs:ro
    environment:
      PHP_FPM_HOST: app
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    volumes:
      - .:/app
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Background jobs (emails...): `bin/cake queue run`. It exits after Queue.workerLifetime and
  # Docker starts it again (also picks up code changes). Logs: docker compose logs -f worker
  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    command: ["bin/cake", "queue", "run"]
    volumes:
      - .:/app
    environment: *app-environment
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cakephp
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cakephp_admin
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18: el volumen va en /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakephp -d cakephp_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
