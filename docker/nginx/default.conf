# HTTP (dev: http://localhost:8080; Coolify: behind Traefik, which ends TLS). HTTPS is
# docker/nginx/https.conf, enabled when there is a certificate.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Container health check (nginx only, no PHP, no HTTPS redirect)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/app-locations.conf;
}
