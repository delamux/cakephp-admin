# HTTPS (https://cakeadmin.local) with the mkcert certificate of docker/certs/ (bin/dev-https-cert).
# Copied to conf.d by 10-enable-https.sh only when the certificate exists: without it nginx keeps serving HTTP.
server {
    listen 443 ssl;
    http2 on;
    server_name cakeadmin.local localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/cakeadmin.local.pem;
    ssl_certificate_key /etc/nginx/certs/cakeadmin.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Security headers, CSP and HSTS are sent by the app (App\Http\SecurityMiddlewares)

    include /etc/nginx/app-locations.conf;
}
