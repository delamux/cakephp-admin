# Shared by the HTTP and HTTPS servers: static files from webroot, the rest to PHP-FPM (`app:9000`).
root /app/webroot;
index index.php;
client_max_body_size 32M;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;

location / {
    try_files $uri /index.php?$args;
}

# Static assets (also plugin assets served by AssetMiddleware when not copied).
# CSS/JS URLs carry `?<mtime>` in production (Asset.timestamp = force), so a longer cache is safe.
location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    try_files $uri /index.php?$args;
    expires 7d;
    access_log off;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTPS $https if_not_empty;
}

location ~ /\. {
    deny all;
}
