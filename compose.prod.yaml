# Production-like stack: self-contained images (no bind mounts), compiled assets, DEBUG off, HTTPS.
#   bin/dev-https-cert   # once: mkcert certificate in docker/certs
#   SECURITY_SALT=$(openssl rand -hex 32) docker compose -f compose.prod.yaml up -d --build
#   -> https://admindashboard.localhost (same port 443 as dev: run one stack at a time)
#   docker compose -f compose.prod.yaml exec app bin/cake migrations migrate
# The database/SMTP here are local examples: point DATABASE_URL / EMAIL_TRANSPORT_DEFAULT_URL to real ones.
name: cakephp-admin-prod

services:
  # nginx: HTTPS with the certificate of docker/certs (mkcert locally; real certificates in production)
  web:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: web
    ports:
      - "${HTTPS_PORT:-8445}:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: prod
    environment:
      DEBUG: "false"
      SECURITY_SALT: "${SECURITY_SALT:?Set SECURITY_SALT (e.g. openssl rand -hex 32)}"
      APP_FULL_BASE_URL: "${APP_FULL_BASE_URL:-https://admindashboard.localhost}"
      DATABASE_URL: "${DATABASE_URL:-postgres://cakephp:secret@db:5432/cakephp_admin}"
      EMAIL_TRANSPORT_DEFAULT_URL: "${EMAIL_TRANSPORT_DEFAULT_URL:-smtp://mailpit:1025}"
      EMAIL_FROM: "${EMAIL_FROM:-admin@cakephp-admin.test}"
      THEME_COMPILED_ASSETS: "true"
      ASSET_TIMESTAMP: "force"
      LOG_TO_STDERR: "true"
      # book.cakephp.org/5.x/security: HTTPS + HSTS, CSP enforced (see README "Seguridad")
      HTTPS_ENFORCE: "true"
      CSP_REPORT_ONLY: "false"
      COOKIE_KEY: "${COOKIE_KEY:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cakephp
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cakephp_admin
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakephp -d cakephp_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest

volumes:
  pgdata:
